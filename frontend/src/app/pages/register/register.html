<app-header></app-header>
<main>
    <section class="container-register">
        <div class="register-card">
            <h2>Crie sua Conta</h2>
            <p>Preencha os dados abaixo para se registrar</p>

            <form>
                <h3>Dados Pessoais</h3>
                <div class="form-row">
                    <div class="input-group full-width">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Nome completo">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" mask="000.000.000-00" placeholder="000.000.000-00">
                    </div>
                    <div class="input-group">
                        <label for="rg">RG</label>
                        <input type="text" id="rg" placeholder="0.000.000">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" id="nascimento">
                    </div>
                    <div class="input-group">
                        <label for="nacionalidade">Nacionalidade</label>
                        <input type="text" id="nacionalidade" placeholder="Brasileiro(a)">
                    </div>
                </div>

                <h3>Contato</h3>
                <div class="form-row">
                    <div class="input-group full-width">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seuemail@exemplo.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="telefone">Celular</label>
                        <input type="text" id="telefone" mask="(00) 00000-0000" placeholder="(00) 00000-0000">
                    </div>
                    <div class="input-group">
                        <label for="emergencia">Tel. Emergência</label>
                        <input type="text" id="emergencia" mask="(00) 00000-0000" placeholder="(00) 00000-0000">
                    </div>
                </div>

                <h3>Endereço</h3>
                <div class="form-row">
                    <div class="input-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" mask="00000-000" placeholder="00000-000">
                    </div>
                    <div class="input-group">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" placeholder="Rua, Número, Bairro">
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-group full-width">
                        <label for="observacao">Observações / Complemento</label>
                        <input type="text" id="observacao" placeholder="Apto, Bloco, Ponto de referência">
                    </div>
                </div>

                <h3>Segurança</h3>
                <div class="form-row">
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <div class="password-container">
                            <input 
                                [type]="passwordVisible ? 'text' : 'password'" 
                                id="senha" 
                                placeholder="Crie uma senha"
                            >
                            <button type="button" class="btn-eye" (click)="togglePasswordVisibility()">
                                <img 
                                    [src]="passwordVisible ? 'assets/icones/visibility_off.svg' : 'assets/icones/visibility.svg'" 
                                    alt="Ver senha"
                                >
                            </button>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="confirmarSenha">Repetir Senha</label>
                        <div class="password-container">
                            <input 
                                [type]="confirmPasswordVisible ? 'text' : 'password'" 
                                id="confirmarSenha" 
                                placeholder="Confirme sua senha"
                            >
                            <button type="button" class="btn-eye" (click)="toggleConfirmPasswordVisibility()">
                                <img 
                                    [src]="confirmPasswordVisible ? 'assets/icones/visibility_off.svg' : 'assets/icones/visibility.svg'" 
                                    alt="Ver senha"
                                >
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-register">Cadastrar</button>
            </form>

            <div class="register-footer">
                <span>Já possui conta? </span>
                <a routerLink="/login">Faça Login</a>
            </div>
        </div>
    </section>
</main>
<app-footer></app-footer>
