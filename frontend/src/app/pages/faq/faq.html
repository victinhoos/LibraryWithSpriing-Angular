<app-header></app-header>

<main>
    <div class="faq-page-wrapper">
        
        <app-faq-card 
            id="como-doar" 
            bgColor="--text-color-primary" 
            titulo="Como faço para doar?" 
            descricao="As doações de livros podem ser realizadas diretamente na recepção. Os materiais arrecadados serão destinados a iniciativas que incentivam a leitura e o acesso ao conhecimento. &#10;&#10;Regras para doação: &#10;• Os livros devem estar em bom estado de conservação. &#10;• Não serão aceitos materiais com conteúdo ofensivo ou impróprio. &#10;• Aceitam-se livros didáticos, literários e paradidáticos atualizados. &#10;• As doações devem ser entregues durante o horário de funcionamento da recepção.">
        </app-faq-card>

        <app-faq-card 
            id="aluguel-espaco" 
            bgColor="--text-color-primary"
            titulo="Como faço para alugar espaço?" 
            descricao="A biblioteca dispõe de salas de estudo em grupo e espaços para eventos acadêmicos que podem ser reservados pelos usuários. &#10;&#10;Passo a passo para reserva: &#10;• Verifique a disponibilidade na aba 'Horário' ou diretamente no balcão. &#10;• A reserva deve ser feita com no mínimo 24 horas de antecedência. &#10;• É necessário apresentar um documento de identificação ativo. &#10;• O uso do espaço é gratuito para fins acadêmicos, sujeito a lotação.">
        </app-faq-card>

        <app-faq-card 
            id="aluguel-livros" 
            bgColor="--text-color-primary"
            titulo="Como faço para alugar livros?" 
            descricao="Para retirar livros, o usuário deve possuir um cadastro ativo em nosso sistema. Cada exemplar possui um prazo específico de devolução. &#10;&#10;Regras de empréstimo: &#10;• O limite é de até 3 livros simultâneos por usuário. &#10;• O prazo padrão de empréstimo é de 7 dias úteis. &#10;• É possível renovar o empréstimo uma vez, caso não haja reserva para o título. &#10;• Atrasos na devolução podem gerar suspensão temporária de novos aluguéis.">
        </app-faq-card>

        <app-faq-card 
            id="perda-danos" 
            bgColor="--text-color-primary"
            titulo="O que fazer em caso de perda ou dano?" 
            descricao="Caso o livro seja extraviado ou sofra danos severos (como molhar ou rasgar), o usuário é responsável pela reposição do material. &#10;&#10;Procedimento: &#10;• Comunique imediatamente a administração da biblioteca. &#10;• O usuário deverá adquirir um exemplar novo do mesmo título e edição para repor o acervo. &#10;• Em caso de títulos esgotados, a coordenação indicará um título equivalente para substituição.">
        </app-faq-card>
        
    </div>
</main>
<app-footer></app-footer>
