<app-header></app-header>
<main>
    <section class="container-login">
        <div class="login-card">
            <h2>Acesse a Biblioteca</h2>
            <p>Entre com seus dados de acesso</p>

            <form>
                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" mask="000.000.000-00">
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Senha</label>
                        <a href="#" class="forgot-password">Esqueceu a senha?</a>
                    </div>
                    
                    <div class="password-container">
                        <input 
                            [type]="passwordVisible ? 'text' : 'password'" 
                            id="password" 
                            placeholder="Digite sua senha"
                        >
                        <button type="button" class="btn-eye" (click)="togglePasswordVisibility()">
                            <img 
                                [src]="passwordVisible ? 'assets/icones/visibility_off.svg' : 'assets/icones/visibility.svg'" 
                                alt="Alternar visibilidade da senha"
                            >
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <div class="login-footer">
                <span>Não tem uma conta? </span>
                <a routerLink="/cadastro"  routerLinkActive="active-link">Cadastre-se aqui</a>
            </div> 
        </div>
    </section>
</main>
<app-footer></app-footer>
